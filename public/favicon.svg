<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGlow" cx="42%" cy="35%" r="72%" fx="38%" fy="30%">
      <stop offset="0%" stop-color="#23262E"/>
      <stop offset="50%" stop-color="#1B1D24"/>
      <stop offset="100%" stop-color="#16181D"/>
    </radialGradient>

    <radialGradient id="redAmbient" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#FF3D3D" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#FF3D3D" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FF3D3D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bookmarkBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="40%" stop-color="#FF3D3D"/>
      <stop offset="100%" stop-color="#E62929"/>
    </linearGradient>

    <linearGradient id="bookmarkEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="bookmarkShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="bookmarkShadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="bookmarkSoftShadow" x="-10%" y="-5%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0" dy="-2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="white" flood-opacity="0.08" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <clipPath id="iconClip">
      <rect width="1024" height="1024" rx="225" ry="225"/>
    </clipPath>

    <mask id="playCutout">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <polygon points="415,432 415,610 705,521" fill="black"/>
    </mask>
  </defs>

  <g clip-path="url(#iconClip)">
    <rect width="1024" height="1024" fill="url(#bgGlow)"/>
    <rect width="1024" height="1024" fill="url(#redAmbient)"/>

    <g filter="url(#bookmarkShadow)">
      <g filter="url(#bookmarkSoftShadow)">
        <path d="
          M 172,235
          A 40,40 0 0,1 212,195
          L 812,195
          A 40,40 0 0,1 852,235
          L 852,848
          L 512,938
          L 172,848
          Z"
          fill="url(#bookmarkBody)"
          mask="url(#playCutout)"
        />

        <path d="
          M 172,235
          A 40,40 0 0,1 212,195
          L 812,195
          A 40,40 0 0,1 852,235
          L 852,848
          L 512,938
          L 172,848
          Z"
          fill="url(#bookmarkShine)"
          mask="url(#playCutout)"
        />

        <path d="
          M 172,235
          A 40,40 0 0,1 212,195
          L 812,195
          A 40,40 0 0,1 852,235
          L 852,848
          L 512,938
          L 172,848
          Z"
          fill="none"
          stroke="url(#bookmarkEdge)"
          stroke-width="2"
          mask="url(#playCutout)"
        />

        <path d="
          M 172,235
          A 40,40 0 0,1 212,195
          L 812,195
          A 40,40 0 0,1 852,235
          L 852,848
          L 512,938
          L 172,848
          Z"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="1.5"
          stroke-opacity="0.06"
          mask="url(#playCutout)"
        />
      </g>
    </g>

    <circle cx="740" cy="240" r="30" fill="#FFD54F"/>
    <circle cx="740" cy="240" r="30" fill="#FFD54F" opacity="0.35" filter="url(#dotGlow)"/>
    <circle cx="740" cy="240" r="12" fill="#FFF8E1" opacity="0.5"/>
  </g>
</svg>
